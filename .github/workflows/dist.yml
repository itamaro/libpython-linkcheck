# Build every distribution once, check them, and run the Linux suite against
# the exact built files. Called by CI on every push/PR and by the release
# workflow, which then publishes the "dist" artifact assembled here:
#   - the sdist and the pure-Python wheel (py3-none-any, for platforms
#     without a native wheel), from `build`;
#   - native manylinux_2_28 wheels for x86_64 and aarch64, from `wheels`
#     (cibuildwheel + auditwheel; see [tool.cibuildwheel] in pyproject.toml).
name: dist

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Build sdist + pure wheel, twine check, content check, smoke-test
        run: sh ci/build-dist.sh
        env:
          PYTHON: python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist/
          if-no-files-found: error

  wheels:
    name: wheels (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install --group wheels
      - name: Build, auditwheel repair, smoke-test
        run: cibuildwheel --platform linux --output-dir wheelhouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-wheels-${{ matrix.arch }}
          path: wheelhouse/
          if-no-files-found: error

  check:
    needs: [build, wheels]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - name: twine check, content check, expected wheel set, no libpython DT_NEEDED
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install --group dist
          python -m twine check --strict dist/*
          python ci/check_dist.py . dist --native-wheels
          ls -l dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    name: test ${{ matrix.package }} (${{ matrix.python }}, ${{ matrix.arch }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        arch: [x86_64, aarch64]
        package: [native-wheel]
        include:
          - { python: "3.11", arch: x86_64, package: pure-wheel }
          - { python: "3.15", arch: x86_64, package: pure-wheel }
          - { python: "3.11", arch: x86_64, package: sdist }
          - { python: "3.15", arch: x86_64, package: sdist }
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: docker.io/library/python:${{ matrix.python }}-trixie
    env:
      LINKCHECK_REQUIRE_LINUX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Run the Linux suite against the built ${{ matrix.package }}
        run: |
          case "${{ matrix.package }}" in
            # A directory: pip picks this interpreter's native wheel.
            native-wheel) PACKAGE=dist ;;
            pure-wheel) PACKAGE=$(ls dist/*-py3-none-any.whl) ;;
            sdist) PACKAGE=$(ls dist/*.tar.gz) ;;
          esac
          export PACKAGE
          sh ci/run-tests.sh
