name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install Ruff, clang-format, and zizmor
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install --group lint
      - run: make lint RUFF=ruff CLANG_FORMAT=clang-format ZIZMOR=zizmor

  # The required Linux suite: real ELF fixtures, DT_NEEDED and loader behavior.
  # Same script and images as `make test-linux`.
  linux:
    name: linux (${{ matrix.python }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        arch: [x86_64]
        include:
          - { python: "3.11", arch: aarch64 }
          - { python: "3.15", arch: aarch64 }
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: docker.io/library/python:${{ matrix.python }}-trixie
    env:
      LINKCHECK_REQUIRE_LINUX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh ci/run-tests.sh

  # The same suite on a free-threaded build of the image's CPython release,
  # compiled from verified source (ci/build-freethreaded.sh) and cached.
  freethreaded:
    name: linux (${{ matrix.python }}t, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
        arch: [x86_64]
    runs-on: ubuntu-24.04
    container: docker.io/library/python:${{ matrix.python }}-trixie
    env:
      LINKCHECK_REQUIRE_LINUX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image's CPython release
        id: release
        run: echo "version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"
      - name: Cache the free-threaded build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/python-ft
          key: python-ft-${{ steps.release.outputs.version }}-${{ matrix.arch }}-${{ hashFiles('ci/build-freethreaded.sh') }}
      - run: sh ci/test-freethreaded.sh

  # The same suite on uv-managed CPython (python-build-standalone): a
  # statically linked executable next to a shipped shared libpython, in a
  # relocatable prefix. Pins: ci/test-uv-python.sh (uv) and this matrix,
  # kept in sync with UV_PYTHONS in the Makefile.
  uv-python:
    name: linux (uv ${{ matrix.python }}, x86_64)
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11.18", "3.12.16", "3.15.2"]
    runs-on: ubuntu-24.04
    container: docker.io/library/python:3.15-trixie
    env:
      LINKCHECK_REQUIRE_LINUX: "1"
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh ci/test-uv-python.sh

  macos:
    name: macos (${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.15"]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: sh ci/run-tests.sh
        env:
          PYTHON: python

  dist:
    uses: $/.github/workflows/dist.yml
