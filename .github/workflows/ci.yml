name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install Ruff and clang-format
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install --group lint
      - run: make lint RUFF=ruff CLANG_FORMAT=clang-format

  # The required Linux suite: real ELF fixtures, DT_NEEDED and loader behavior.
  # Same script and images as `make test-linux`.
  linux:
    name: linux (${{ matrix.python }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        arch: [x86_64]
        include:
          - { python: "3.11", arch: aarch64 }
          - { python: "3.15", arch: aarch64 }
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: docker.io/library/python:${{ matrix.python }}-trixie
    env:
      LINKCHECK_REQUIRE_LINUX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh ci/run-tests.sh

  macos:
    name: macos (${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.15"]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: sh ci/run-tests.sh
        env:
          PYTHON: python

  dist:
    uses: ./.github/workflows/dist.yml
