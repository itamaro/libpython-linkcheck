# Publish to PyPI when a v* tag is pushed. The artifacts are built and tested
# once (dist.yml) and those exact files are uploaded via Trusted Publishing:
# libpython-linkcheck first ("dist"), then the libpython-linkcheck-autoenable
# companion ("autoenable"), which pins that exact version. Each upload is
# its own job, so if the companion's fails after the core's succeeded,
# "Re-run failed jobs" retries only the companion with the same files.
# See "Release procedure" in AGENTS.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: verify-tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag must match __version__ (and the companion's version and pin) and be on main
        run: |
          version=$(python3 -c 'import ast,sys; t=ast.parse(open("src/libpython_linkcheck/_version.py").read()); print(next(ast.literal_eval(n.value) for n in t.body if isinstance(n, ast.Assign)))')
          companion=$(python3 -c 'import tomllib; p=tomllib.load(open("autoenable/pyproject.toml","rb"))["project"]; print(p["version"], *p["dependencies"])')
          echo "tag=$GITHUB_REF_NAME version=$version companion=$companion"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$companion" = "$version libpython-linkcheck==$version"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  dist:
    needs: verify-tag
    uses: $/.github/workflows/dist.yml

  publish:
    name: publish
    needs: dist
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/libpython-linkcheck/
    permissions:
      id-token: write # Trusted Publishing: OIDC token for a short-lived PyPI upload token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: ls -l dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  publish-autoenable:
    name: publish-autoenable
    needs: publish
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/libpython-linkcheck-autoenable/
    permissions:
      id-token: write # Trusted Publishing: OIDC token for a short-lived PyPI upload token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: autoenable
          path: autoenable-dist/
      - run: ls -l autoenable-dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: autoenable-dist/
