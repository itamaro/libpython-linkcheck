[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "libpython-linkcheck"
dynamic = ["version"]
description = "Warn when an imported Python extension directly links to libpython on Linux."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Itamar Oren" }]
keywords = ["libpython", "elf", "dt_needed", "extension", "audit-hook", "linker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/itamaro/libpython-linkcheck"
Source = "https://github.com/itamaro/libpython-linkcheck"
Issues = "https://github.com/itamaro/libpython-linkcheck/issues"

[dependency-groups]
test = ["pytest==9.2.0"]
lint = ["ruff==0.17.6", "clang-format==23.1.5"]
dist = ["build==1.6.1", "twine==7.0.0"]
wheels = ["cibuildwheel==4.3.5"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "dist" },
]

[tool.setuptools.dynamic]
version = { attr = "libpython_linkcheck._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["libpython_linkcheck*"]
namespaces = false

[tool.setuptools.package-data]
libpython_linkcheck = ["py.typed"]

[tool.cibuildwheel]
# Native wheels: manylinux_2_28 for every supported CPython, including the
# free-threaded builds. Other platforms (macOS, musl, ...) use the pure-Python
# wheel. See "Native wheels" in AGENTS.md.
build = [
    "cp311-manylinux_*",
    "cp312-manylinux_*",
    "cp313-manylinux_*",
    "cp314-manylinux_*",
    "cp314t-manylinux_*",
    "cp315-manylinux_*",
    "cp315t-manylinux_*",
]
build-frontend = "build"
environment = { CFLAGS = "-Werror" }
test-command = "python {project}/ci/wheel_smoke.py {project}"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
repair-wheel-command = [
    "auditwheel show {wheel}",
    "auditwheel repair --only-plat --plat manylinux_2_28_$(uname -m) -w {dest_dir} {wheel}",
    "auditwheel show {dest_dir}/*.whl",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
markers = ["requires_native: needs the C implementation; deselected when it is not built"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "PL", "C4", "PIE", "RET"]
ignore = [
    "PLR2004", # magic values are clearer than named constants for ELF fields
    "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915", "S101"]
