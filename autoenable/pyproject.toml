# Opt-in automatic activation for libpython-linkcheck.
#
# Installing this distribution makes every interpreter that processes its
# site-packages directory (venvs included; not -S) call
# libpython_linkcheck._autoenable() (enable(), see README.md) at startup. It
# contains only two startup files at the root of site-packages; installing
# libpython-linkcheck by itself never activates anything.
#
# Its version, and its exact dependency on libpython-linkcheck, must equal
# libpython-linkcheck's __version__ (checked by ci/check_autoenable.py).
[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "libpython-linkcheck-autoenable"
version = "1.0.0rc1"
description = "Enable libpython-linkcheck automatically at interpreter startup"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Itamar Oren" }]
keywords = ["libpython", "elf", "dt_needed", "extension", "audit-hook", "linker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["libpython-linkcheck==1.0.0rc1"]

[project.urls]
Homepage = "https://github.com/itamaro/libpython-linkcheck"
Source = "https://github.com/itamaro/libpython-linkcheck/tree/main/autoenable"
Issues = "https://github.com/itamaro/libpython-linkcheck/issues"

[tool.hatch.build.targets.sdist]
only-include = [
    "libpython_linkcheck_autoenable.pth",
    "libpython_linkcheck_autoenable.start",
    "README.md",
    "LICENSE",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"libpython_linkcheck_autoenable.pth" = "libpython_linkcheck_autoenable.pth"
"libpython_linkcheck_autoenable.start" = "libpython_linkcheck_autoenable.start"
