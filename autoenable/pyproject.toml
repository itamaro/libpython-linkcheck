# Opt-in automatic activation for libpython-linkcheck.
#
# Installing this distribution makes every interpreter that processes its
# site-packages directory (venvs included; not -S) call
# libpython_linkcheck.enable() at startup. It contains only two startup files
# at the root of site-packages; installing libpython-linkcheck by itself never
# activates anything.
#
# Not published to PyPI: build it with `python -m build --wheel autoenable`
# (or copy the two files into site-packages yourself). Its version must equal
# libpython-linkcheck's (checked by ci/build-dist.sh).
[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "libpython-linkcheck-autoenable"
version = "0.1.0a2.dev0"
description = "Enable libpython-linkcheck automatically at interpreter startup"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["libpython-linkcheck==0.1.0a2.dev0"]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"libpython_linkcheck_autoenable.pth" = "libpython_linkcheck_autoenable.pth"
"libpython_linkcheck_autoenable.start" = "libpython_linkcheck_autoenable.start"
